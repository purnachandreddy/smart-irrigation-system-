; PlatformIO Project Configuration
; Smart Plant Irrigation System — ESP32
; =============================================================

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

; ── Serial monitor ────────────────────────────────────────────
monitor_speed = 115200

; ── Filesystem upload ─────────────────────────────────────────
board_build.filesystem = littlefs

; ── Build flags ───────────────────────────────────────────────
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM=0
    ; Set to 1 to enable optional flow sensor support
    -DUSE_FLOW_SENSOR=0
    ; Set to 1 to enable DHT22 temperature/humidity sensor
    -DUSE_DHT=0
    ; Set to 1 to enable verbose serial debug output
    -DDEBUG_SERIAL=1
    ; Water level sensor: 1=analog (ADC), 0=digital float switch
    -DWATER_LEVEL_ANALOG=1

; ── Partition scheme (4 MB flash: app 1.9 MB + LittleFS 1.9 MB)
board_build.partitions = default.csv

; ── Libraries ─────────────────────────────────────────────────
lib_deps =
    ; Non-blocking async web server
    https://github.com/me-no-dev/ESPAsyncWebServer.git
    ; Required by ESPAsyncWebServer
    https://github.com/me-no-dev/AsyncTCP.git
    ; ArduinoJson for REST API serialization
    bblanchon/ArduinoJson@^7.2.0
    ; DHT sensor library (only compiled when USE_DHT=1)
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    ; LittleFS is bundled with esp32 Arduino core >= 2.x
